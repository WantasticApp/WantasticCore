name: Release Wantastic

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.25.10'
  # Opt into Node.js 24 for the JavaScript-based actions themselves
  # (checkout, setup-go, setup-node, upload-artifact, pnpm/action-setup).
  # GitHub removes Node.js 20 from runners on 2026-09-16; this env makes
  # the deprecation warning go away today and is forward-compatible.
  # This does NOT affect the project's own Node version — that's still
  # pinned via actions/setup-node@v4 with node-version: '20'.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The portal binary embeds the SPA via //go:embed app/dist/*, so the
      # dist tree must exist on disk before `go build`. pnpm + Node here
      # produce it; without this step `go build` fails with
      # "pattern app/dist/*: no matching files found".
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the local toolchain: app/pnpm-workspace.yaml uses
          # onlyBuiltDependencies (pnpm 10), and pnpm 9 errors with
          # "packages field missing or empty" trying to parse it.
          version: 10.29.3
          run_install: false

      - name: Build SPA (portal frontend)
        working-directory: internal/portalsrv/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build wantastic-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          OUT="dist/wantastic-core-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.VERSION }}" \
            -o "${OUT}" \
            ./cmd/wantastic-core
          (cd dist && tar -czf "$(basename ${OUT}).tar.gz" "$(basename ${OUT})")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wantastic-core-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  build-image:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      # Derive the GHCR image path from the actual repo owner so this
      # workflow keeps working in forks (and doesn't depend on a hardcoded
      # "wantastic-app" namespace that may not exist for the runner's token).
      # GHCR requires the owner segment to be lowercase.
      - name: Resolve image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/wantastic" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.VERSION }}
            ${{ steps.image.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  release:
    name: Publish GitHub release
    needs: [build-binaries, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # Match only the binary tarballs uploaded by build-binaries.
          # docker/build-push-action@v6 also drops a `*.dockerbuild`
          # build-summary artifact in the same run; without this filter
          # download-artifact tries to merge it alongside the tarballs
          # and the whole step fails with "Artifact download failed".
          pattern: wantastic-core-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: false
          body: |
            # Wantastic ${{ steps.version.outputs.VERSION }}

            ## Container image

            ```
            docker pull ${{ needs.build-image.outputs.image }}:${{ steps.version.outputs.VERSION }}
            ```

            The recommended deployment uses `docker/docker-compose.yml`, which
            brings up postgres, redis, and wantastic-core in one shot.

            ## Binaries

            Standalone binaries are attached below for `linux/amd64` and
            `linux/arm64`. For most users the container image is the
            preferred install path.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
